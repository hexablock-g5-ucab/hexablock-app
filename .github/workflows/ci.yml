name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Package tests (every package that has a test/ folder)
        run: |
          for pkg in packages/*/; do
            if [ -d "$pkg/test" ]; then
              echo "::group::$pkg"
              (cd "$pkg" && dart test)
              echo "::endgroup::"
            fi
          done
      - name: Widget tests
        working-directory: app
        run: flutter test
